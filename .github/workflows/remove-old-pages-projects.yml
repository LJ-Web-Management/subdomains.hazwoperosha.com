name: Remove old Pages projects

# One-off cleanup after moving from one Cloudflare Pages project per site to a
# single Worker: deletes the sub-<folder> Pages projects that no longer serve
# anything. Run it by hand from the Actions tab once the Worker deploy is live.

on:
  workflow_dispatch:

# The jobs only read the repo; Cloudflare access comes from the secrets.
permissions:
  contents: read

concurrency:
  group: deploy-sites
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Remove old Pages projects
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/remove-old-pages-projects.sh
