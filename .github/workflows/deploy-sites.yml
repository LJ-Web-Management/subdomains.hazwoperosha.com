name: Deploy subdomain sites

# Every folder in sites/ is served at <folder>.hazwoperosha.com by one
# Cloudflare Worker (worker/index.js). Each run deploys all sites; only files
# that changed since the last deploy are uploaded.

on:
  push:
    branches: [main]
    paths:
      - 'sites/**'
      - 'worker/**'
      - 'wrangler.json'
      - 'scripts/deploy.sh'
      - '.github/workflows/deploy-sites.yml'
  workflow_dispatch:

concurrency:
  group: deploy-sites
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/deploy.sh
