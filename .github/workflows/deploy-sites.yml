name: Deploy subdomain sites

# Every folder in sites/ is served at <folder>.hazwoperosha.com by one
# Cloudflare Worker (worker/index.js). Each run deploys all sites; only files
# that changed since the last deploy are uploaded.

on:
  push:
    branches: [main]
    paths:
      - 'sites/**'
      - 'worker/**'
      - 'wrangler.json'
      - 'scripts/deploy.sh'
      - 'scripts/build-hub.sh'
      - 'scripts/build-checkout.py'
      - 'scripts/check-sites.mjs'
      - 'data/**'
      - '.github/workflows/deploy-sites.yml'
  workflow_dispatch:

# The jobs only read the repo; Cloudflare access comes from the secrets.
permissions:
  contents: read

concurrency:
  group: deploy-sites
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Check sites and checkout
        run: |
          python3 -I scripts/build-checkout.py --check
          node scripts/check-sites.mjs
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/deploy.sh
